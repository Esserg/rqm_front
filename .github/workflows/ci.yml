name: CI/CD Frontend Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    # Runs on our cluster self-hosted runner
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Push Docker Image
        shell: bash
        run: |
          REGISTRY="${DOCKER_REGISTRY_URL:-registry.local}"
          IMAGE_NAME="rqm-frontend"
          IMAGE_TAG="${{ github.sha }}"

          echo "=========================================="
          echo "Building $IMAGE_NAME:$IMAGE_TAG..."
          echo "Target Registry: $REGISTRY"
          echo "=========================================="

          docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -t $REGISTRY/$IMAGE_NAME:latest -f ./Dockerfile .

          echo "Pushing image to registry..."
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:latest

          echo "Successfully pushed $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
